[package]
name = "broker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
env_logger = "0.11.10"
log = "0.4.30"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
tokio = { version = "1.52.3", features = ["full", "signal"] }
tokio-tungstenite = "0.29.0"
instant_messenger_common = { path = "../instant_messenger_common/" }
chrono = { version = "0.4.45", features = ["serde"] }
scc = "3.7.1"
futures-util = "0.3.32"
bytes = "1.11.1"

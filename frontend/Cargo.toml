[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
gloo-net = "0.7.0"
wasm-cookies = "0.2.1"
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
implicit-clone = { version = "0.6.0", features = ["serde"] }
futures-util = "0.3.32"
serde_repr = "0.1.20"
num-traits = "0.2.19"

[dependencies.web-sys]
version = "0.3"
features = [
  "HtmlElement",
  "HtmlInputElement",
  "FocusEvent",
  "KeyboardEvent",
  "EventTarget",
  "Event",
  "Document",
  "Element",
  "DomTokenList",
  "HtmlDocument",
  "console",
  "DomRect",
]

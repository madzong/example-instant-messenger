[package]
name = "rest-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
env_logger = "0.11.10"
log = "0.4.30"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = { version = "0.7.17", features = ["with-chrono-0_4", "with-uuid-1"] }
instant-messenger-common = { path = "../instant-messenger-common/" }
reqwest = "0.13.4"
serde = "1.0.228"
serde_json = "1.0.150"
argon2 = { version = "0.5.3", features = ["std"] }
http-body-util = { version = "0.1.3", default-features = false }
uuid = "1.23.2"
chrono = "0.4.45"

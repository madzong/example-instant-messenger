[package]
name = "instant-messenger-common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", default-features = false }
chrono = { version = "0.4.44", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
tokio-postgres = { version = "0.7.17", default-features = false }
uuid = { version = "1.23.2", features = ["serde", "v4"] }
